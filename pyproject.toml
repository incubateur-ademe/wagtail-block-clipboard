[project]
name = "wagtail-block-clipboard"
version = "0.1.0"
description = "Copy StreamField blocks and paste them in other fields and pages of the Wagtail admin."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Framework :: Django",
    "Framework :: Wagtail",
]
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "wagtail>=8.1,<8.2",
]

[project.urls]
Homepage = "https://github.com/incubateur-ademe/wagtail-block-clipboard"
Repository = "https://github.com/incubateur-ademe/wagtail-block-clipboard"
Changelog = "https://github.com/incubateur-ademe/wagtail-block-clipboard/blob/main/CHANGELOG.md"
Issues = "https://github.com/incubateur-ademe/wagtail-block-clipboard/issues"

[dependency-groups]
dev = [
    "ruff>=0.15",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wagtail_block_clipboard"
